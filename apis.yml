description: >-
  Zudoku is an open-source, developer-first platform for creating clean, consistent API documentation built on a modern
  stack including React, TypeScript, and Vite. The tool enables developers to auto-generate documentation from OpenAPI
  v2/v3 schemas (supporting both single and multi-API setups) and provides built-in authentication and authorization
  support for OAuth2, JWT, and more.
